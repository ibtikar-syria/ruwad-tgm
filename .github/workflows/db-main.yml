name: (main) [database-migrations] Migrate D1 Databases

on:
  push:
    branches:
      - main
    paths:
      - 'database/**'
      - '.github/workflows/db-main.yml'
  workflow_dispatch:

jobs:
  backend-migrations:
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables
        run: |
          jq_filter='.d1_databases[0].database_id = $dbid0
          | .d1_databases[0].database_name = $dbname0
          | .d1_databases[1].database_id = $dbid1
          | .d1_databases[1].database_name = $dbname1
          | .account_id = $accountId'

          jq \
            --arg dbid0 "${{ vars.TELEGRAM_MESSAGES_DB_ID }}" \
            --arg dbname0 "${{ vars.TELEGRAM_MESSAGES_DB_NAME }}" \
            --arg dbid1 "${{ vars.MAIN_DB_ID }}" \
            --arg dbname1 "${{ vars.MAIN_DB_NAME }}" \
            --arg accountId "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            "$jq_filter" \
            wrangler.jsonc > wrangler.local.jsonc

      - name: Migrate D1 Databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler d1 migrations apply ${{ vars.TELEGRAM_MESSAGES_DB_NAME }} --remote --config wrangler.local.jsonc
          wrangler d1 migrations apply ${{ vars.MAIN_DB_NAME }} --remote --config wrangler.local.jsonc
